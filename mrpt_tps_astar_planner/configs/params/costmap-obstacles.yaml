# For CostEvaluatorCostMap
resolution: 0.10
# Extra cost per second of motion, maxCost*(1-d/D)^2, for footprints closer
# than D to obstacles. Large values make paths detour and weave in search of
# clearance, and slow down the search (its heuristic only accounts for time).
preferredClearanceDistance: 1.0
maxCost: 10.0

useAverageOfPath: false

maxRadiusFromRobot: 0.0  # [meters]
