# Parameters for mpp::TrajectoryFollower (loaded by mrpt_trajectory_follower_node
# via the 'follower_parameters' node parameter).

# --- Kinematic limits ---
max_speed: 0.5             # [m/s]
max_accel: 0.5             # [m/s^2]
max_decel: 0.7             # [m/s^2]
max_lateral_accel: 1.0     # [m/s^2] curvature speed limit
# max_omega_rate: 0.0      # [rad/s^2] <=0 (default) disables: no cap on how
                            # fast the commanded omega itself may step between
                            # cycles. Prefer max_curvature_rate below on a
                            # steered (car-like) platform: an omega-domain cap
                            # corrupts the executed turn radius whenever the
                            # speed profile changes v, and wrongly slews the
                            # legitimate instantaneous omega sign flip at a
                            # cusp (constant curvature, v reversing).
# max_curvature_rate: 0.0  # [1/m per s] <=0 (default) disables: no cap on how
                            # fast the commanded curvature may change between
                            # cycles. Enable to model a finite steering slew
                            # (steering angle is a function of curvature
                            # alone); keeps (v, omega) on one consistent
                            # circle while v ramps.

# --- Pure-pursuit lookahead (curvature-adaptive) ---
# Marched along the path until it has bent by lookahead_bend, capped at
# lookahead_max travel: long/smooth on straights, short on curves and into the
# terminal maneuver. No per-speed schedule to tune.
lookahead_max: 1.5         # [m] max lookahead travel
lookahead_bend: 25.0       # [deg] path bend that caps the lookahead
# min_lookahead_arc: 0.3   # [m] min arc-length advance of the lookahead along
                            # the path (keeps it off the robot itself).
# min_lookahead_dist: 0.0  # [m] <=0 (default) disables: the pure-pursuit
                            # target's Euclidean distance from the vehicle is
                            # allowed to collapse (near the goal, approaching a
                            # cusp, or on a path curling back on itself), where
                            # the ~2/Ld^2 pursuit gain turns centimeter-level
                            # localization noise into full-authority steering
                            # swings. Enable (e.g. >= min_turn_radius) to keep
                            # the target at least this far away everywhere:
                            # first advanced further along the path, then
                            # extrapolated past the goal/cusp when pinned.

# --- Goal / tracking tolerances ---
goal_dist_tol: 0.15        # [m]
goal_ang_tol: 12.0         # [deg]
max_cross_track: 1.0       # [m] -> OffPathExceeded
# off_path_min_duration: 0.0 # [s] 0 (default): OffPathExceeded fires on the
                            # first cycle over the limit. Set > 0 to debounce
                            # transient localization spikes: the fault only
                            # fires after the cross-track has stayed over the
                            # limit continuously this long.
arrival_radius: 0.3        # [m] settle-and-hold radius at the goal (anti-runaway)

# --- control-pose complementary filter (odometry + localization) ---
# The control pose is dead-reckoned from the wheel odometry and corrected
# toward the raw localization at the vehicle, so behavior does not depend on
# the robot's distance from the odom origin. Parameter names keep the
# historical "anchor_" prefix.
# anchor_time_constant: 0.0       # [s] 0 (default): no low-pass; each cycle
                                   # applies the whole correction residual
                                   # (subject to the rate clamps). Set
                                   # ~0.3-0.5 s with a jittery localization
                                   # so the control pose does not chase the
                                   # jitter.
# anchor_max_lin_rate: 0.5        # [m/s] translational correction rate limit
# anchor_max_ang_rate: 1.0        # [rad/s] rotational correction rate limit
# anchor_max_lin_divergence: 0.0  # [m] <=0 disables: hard bound on how far the
                                   # control pose may stray from the raw
                                   # localization (safety net when the jitter
                                   # outruns the filter for a long time).
# anchor_max_ang_divergence: 0.0  # [rad] rotational counterpart: caps the
                                   # control pose's heading divergence from
                                   # the raw localization. Keep tight (e.g.
                                   # ~0.08 rad) with a jittery localization;
                                   # slow genuine corrections still pass.

# --- Loop timing ---
control_period: 0.05       # [s] (20 Hz)
horizon: 1.5               # [s] emitted chunk length
sample_period: 0.1         # [s] emitted chunk sampling
emit_frame: odom

# --- Predictive safety (inert unless a footprint + obstacles are available) ---
safety_margin: 0.05                # [m] footprint inflation = "contact"
stop_distance: 0.3                 # [m] contact within -> full stop
slow_distance: 1.5                 # [m] contact beyond -> full speed
safety_horizon: 3.0                # [s] forecast rollout length
reference_lookahead_dist: 2.5      # [m] reference sweep distance
footprint_sample_resolution: 0.1   # [m]
resume_scale: 0.2                  # hysteresis to resume after a stop
block_timeout: 5.0                 # [s] stopped longer than this -> Blocked
