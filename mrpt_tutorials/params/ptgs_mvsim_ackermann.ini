# ------------------------------------------------------------------------
# PTGs for the mvsim "car_ackermann" vehicle (see mvsim ackermann.vehicle.xml):
# wheelbase 1.3 m, max steering 30 deg => min turning radius ~2.25 m.
# This file is the robot description shared by the planner and the path
# follower (footprint, kinematics), so both always use the same values.
# Both PTGs are circular arcs (C-PTG), so their turning radius
# R = v_max / w_max is speed independent; it is set above the
# vehicle limit (~33%) to leave steering authority for tracking corrections.
# ------------------------------------------------------------------------

# Nominal linear speed (m/s), used for edge time costs only:
@define ROBOT_MAX_V  1.0
# Max angular speed (deg/s) => R_min = ROBOT_MAX_V / ROBOT_MAX_W = 3.0 m
@define ROBOT_MAX_W  19.1
# Max distance to "foresee" obstacles (m):
@define NAV_MAX_REF_DIST 4.0

[SelfDriving]
min_obstacles_height  = 0.0
max_obstacles_height  = 2.0

# Forward and backward motion (also needed by the Reeds-Shepp shots, which
# require the same, odd number of paths in both PTGs):
PTG_COUNT = 2

PTG0_Type = ptg::DiffDrive_C
PTG0_resolution = 0.10
PTG0_refDistance= ${NAV_MAX_REF_DIST}
PTG0_num_paths= 151
PTG0_v_max_mps = ${ROBOT_MAX_V}
PTG0_w_max_dps = ${ROBOT_MAX_W}
PTG0_K = +1.0   # forwards
PTG0_clearance = 0.10  # [m] min distance to keep to obstacles
PTG0_score_priority = 1.0

PTG1_Type = ptg::DiffDrive_C
PTG1_resolution = 0.10
PTG1_refDistance= ${NAV_MAX_REF_DIST}
PTG1_num_paths= 151
PTG1_v_max_mps = ${ROBOT_MAX_V}
PTG1_w_max_dps = ${ROBOT_MAX_W}
PTG1_K = -1.0   # backwards
PTG1_clearance = 0.10  # [m] min distance to keep to obstacles
PTG1_score_priority = 0.5

# Physical min turning radius of the vehicle (shared with the path follower;
# PTGs turning tighter than this are rejected when loaded):
RobotModel_min_turning_radius = 2.25

# Robot footprint: chassis + wheels, with a few cm of margin.
# Origin (base_link) is the rear axle center.
RobotModel_shape2D_xs = -0.85  1.85  1.85 -0.85
RobotModel_shape2D_ys = -1.20 -1.20  1.20  1.20
